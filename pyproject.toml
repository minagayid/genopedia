[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genopedia"
description = "Offline-first DNA/RNA sequence inspection and reporting toolkit"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Genopedia Project" }]
dependencies = []

[project.optional-dependencies]
bio = ["biopython>=1.85,<2"]
ml = ["numpy>=1.26", "scikit-learn>=1.4"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3", "authlib>=1.3,<2", "itsdangerous>=2.2,<3", "slowapi>=0.1.9,<1", "httpx>=0.27,<1"]
dev = ["pytest>=8", "black>=24", "flake8>=7"]

[project.scripts]
genopedia = "genopedia.cli:main"

[tool.setuptools.packages.find]
include = ["genopedia*"]

[tool.setuptools.package-data]
genopedia = ["reference-manifest.json"]

[tool.setuptools.dynamic]
version = { attr = "genopedia.__version__" }

[tool.black]
line-length = 100

