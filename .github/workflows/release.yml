name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from genopedia import __version__

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag_version != __version__:
              raise SystemExit(
                  f"Release tag is {tag_version!r}, but Genopedia version is {__version__!r}"
              )
          print(f"Release version verified: {__version__}")
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel
          python -m twine check --strict dist/*
      - name: Store release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/genopedia/
    permissions:
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
