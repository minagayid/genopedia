services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: genopedia
      POSTGRES_USER: genopedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [genopedia_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U genopedia -d genopedia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://genopedia:${POSTGRES_PASSWORD}@db:5432/genopedia
      APP_ENV: production
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
networks:
  internal: {driver: bridge}
volumes:
  genopedia_postgres:
